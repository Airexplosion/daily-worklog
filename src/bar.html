<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>再截一张</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <style>
    html, body { background: transparent; height: 100%; overflow: hidden; user-select: none; }
    .bar {
      position: absolute; left: 50%; top: 8px; transform: translateX(-50%); max-width: calc(100% - 20px);
      display: flex; align-items: center; gap: 12px; white-space: nowrap;
      background: rgba(32, 32, 32, 0.92); color: #fff; font-size: 13px;
      padding: 7px 8px 7px 14px; border-radius: 8px; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.28);
    }
    .bar kbd {
      font-family: inherit; font-size: 12px; border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 3px; padding: 0 5px; margin: 0 2px;
    }
    .bar button {
      font: inherit; font-size: 12.5px; color: #fff; background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 5px; padding: 3px 10px; cursor: pointer;
    }
    .bar button:hover { background: rgba(255, 255, 255, 0.22); }
  </style>
</head>
<body>
  <div class="bar">
    <span id="text"></span>
    <button id="done">不截了，去写说明</button>
  </div>
  <script src="js/bar.js"></script>
</body>
</html>
